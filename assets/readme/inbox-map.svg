<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320"
     role="img" aria-labelledby="inTitle inDesc">
  <title id="inTitle">Карта inbox</title>
  <desc id="inDesc">Рабочие папки сканов и расшифровок. Фото в git не коммитятся.</desc>
  <rect width="1200" height="320" rx="4" fill="#f3efe6"/>
  <rect x="48" y="24" width="3" height="40" fill="#2e2a24"/>
  <text x="64" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="16" letter-spacing="3" fill="#7a6548">INBOX · НЕ САЙТ</text>
  
  <rect x="48" y="38" width="1104" height="36" fill="#faf7f0"/>
  <text x="64" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#1c1915">inbox/scans/memoirs/</text>
  <text x="560" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="18" fill="#5c564c">фото рукописных мемуаров</text>
  <rect x="48" y="78" width="1104" height="36" fill="#f3efe6"/>
  <text x="64" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#1c1915">inbox/scans/photos/</text>
  <text x="560" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="18" fill="#5c564c">семейные фото на разбор</text>
  <rect x="48" y="118" width="1104" height="36" fill="#faf7f0"/>
  <text x="64" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#1c1915">inbox/scans/documents/</text>
  <text x="560" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="18" fill="#5c564c">документы и письма</text>
  <rect x="48" y="158" width="1104" height="36" fill="#f3efe6"/>
  <text x="64" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#1c1915">inbox/transcripts/</text>
  <text x="560" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="18" fill="#5c564c">расшифровки до публикации</text>
  <rect x="48" y="198" width="1104" height="36" fill="#faf7f0"/>
  <text x="64" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#1c1915">inbox/notes/</text>
  <text x="560" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="18" fill="#5c564c">вопросы к семье</text>
  <rect x="48" y="238" width="1104" height="36" fill="#f3efe6"/>
  <text x="64" y="264" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#1c1915">content/ru · content/en</text>
  <text x="560" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="18" fill="#5c564c">готовые страницы сайта</text>
</svg>
