      source: family knowledge / previous biographical page o-tatyane-timofeevne
      confidence: family_memory
    - value: "21/IV–1926"
      source: manuscript “Наша родословная. Самсоновы”, original_page 003 (genealogical chart)
      confidence: manuscript_chart
    - value: "lived to 95 years"
      source: family summary on homepage and about page
