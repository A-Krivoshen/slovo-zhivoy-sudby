baseURL = 'https://сжс.рф/'
title = 'Слово Живой Судьбы'
theme = 'PaperMod'
defaultContentLanguage = 'ru'
defaultContentLanguageInSubdir = false

enableRobotsTXT = true
enableGitInfo = true
canonifyURLs = false
pagination.pagerSize = 12
summaryLength = 50
timeZone = 'Europe/Moscow'

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[sitemap]
  changefreq = 'weekly'
  priority = 0.5
  filename = 'sitemap.xml'

[taxonomies]
  tag = 'tags'
  category = 'categories'
  person = 'people'

[imaging]
  quality = 85
  resampleFilter = 'Lanczos'

# ---------------------------------------------------------------------------
# Russian (default)
# ---------------------------------------------------------------------------
[languages.ru]
  locale = 'ru-RU'
  label = 'Русский'
  weight = 1
  title = 'Слово Живой Судьбы'
  contentDir = 'content/ru'

  [languages.ru.params]
    description = 'Мемуары, семейный архив и исторические факты о жизни Кривошеиной Татьяны Тимофеевны, её родителей и рода'
    author = 'Семья Кривошеиных'
    keywords = ['Кривошеина Татьяна Тимофеевна', 'мемуары', 'семейный архив', 'Слово Живой Судьбы', 'история семьи']
    DateFormat = '2.01.2006'
    # light = default attribute; real choice is time-of-day unless user toggles (see layouts/baseof.html)
    defaultTheme = 'light'
    disableThemeToggle = false
    ShowReadingTime = true
    ShowShareButtons = false
    ShowPostNavLinks = true
    ShowBreadCrumbs = true
    ShowCodeCopyButtons = false
    ShowWordCount = false
    ShowRssButtonInSectionTermList = true
    UseHugoToc = true
    disableSpecial1stPost = true
    disableScrollToTop = false
    comments = false
    hidemeta = false
    hideSummary = false
    showtoc = true
    tocopen = false
    ShowFullTextinRSS = false
    ShowTranslationButton = true
    # Empty: home is a curated portal, not a post dump
    mainSections = []

    [languages.ru.params.assets]
      favicon = 'favicon.ico'
      favicon16x16 = 'favicon-16x16.png'
      favicon32x32 = 'favicon-32x32.png'
      apple_touch_icon = 'apple-touch-icon.png'
      safari_pinned_tab = 'safari-pinned-tab.svg'
      theme_color = '#1a1a1a'
      msapplication_TileColor = '#1a1a1a'

    [languages.ru.params.label]
      text = 'Слово Живой Судьбы'
      icon = '/apple-touch-icon.png'
      iconHeight = 26

    # homeInfoParams disabled — hero lives in content/ru/_index.md

    [languages.ru.params.fuseOpts]
      isCaseSensitive = false
      shouldSort = true
      location = 0
      distance = 1000
      threshold = 0.35
      minMatchCharLength = 2
      keys = ['title', 'permalink', 'summary', 'content']

  [[languages.ru.menu.main]]
    identifier = 'home'
    name = 'Главная'
    url = '/'
    weight = 10
  [[languages.ru.menu.main]]
    identifier = 'vospominaniya'
    name = 'Воспоминания'
    url = '/vospominaniya/'
    weight = 20
  [[languages.ru.menu.main]]
    identifier = 'roditeli'
    name = 'Родители'
    url = '/roditeli/'
    weight = 30
  [[languages.ru.menu.main]]
    identifier = 'istoriya'
    name = 'История'
    url = '/istoriya/'
    weight = 40
  [[languages.ru.menu.main]]
    identifier = 'mesta'
    name = 'Места'
    url = '/mesta/'
    weight = 45
  [[languages.ru.menu.main]]
    identifier = 'foto'
    name = 'Фото'
    url = '/foto/'
    weight = 50
  [[languages.ru.menu.main]]
    identifier = 'dokumenty'
    name = 'Документы'
    url = '/dokumenty/'
    weight = 60
  [[languages.ru.menu.main]]
    identifier = 'search'
    name = 'Поиск'
    url = '/search/'
    weight = 70
  [[languages.ru.menu.main]]
    identifier = 'o-proekte'
    name = 'О проекте'
    url = '/o-proekte/'
    weight = 80
  [[languages.ru.menu.main]]
    identifier = 'privacy'
    name = 'Конфиденциальность'
    url = '/konfidencialnost/'
    weight = 85

