<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280"
     role="img" aria-labelledby="inTitle inDesc">
  <title id="inTitle">Карта папки inbox</title>
  <desc id="inDesc">Структура рабочей папки inbox для сканов, расшифровок и заметок</desc>
  <rect width="1200" height="280" rx="20" fill="#F5ECDC"/>
  <rect x="0" y="0" width="12" height="280" fill="#8B5A3C"/>
  <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" letter-spacing="2" fill="#8B5A3C" font-weight="600">INBOX · РАБОЧАЯ ЗОНА (НЕ САЙТ)</text>
  
  <rect x="36" y="36" width="1128" height="32" rx="10" fill="#FFFDF8" stroke="#C4A882" stroke-width="1"/>
  <text x="56" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#5C3D2E">inbox/scans/memoirs/</text>
  <text x="520" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#7A5644">рукописные мемуары</text>
  <rect x="36" y="72" width="1128" height="32" rx="10" fill="#E8D9C0" stroke="#C4A882" stroke-width="1"/>
  <text x="56" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#5C3D2E">inbox/scans/photos/</text>
  <text x="520" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#7A5644">семейные фото на разбор</text>
  <rect x="36" y="108" width="1128" height="32" rx="10" fill="#FFFDF8" stroke="#C4A882" stroke-width="1"/>
  <text x="56" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#5C3D2E">inbox/scans/documents/</text>
  <text x="520" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#7A5644">документы и письма</text>
  <rect x="36" y="144" width="1128" height="32" rx="10" fill="#E8D9C0" stroke="#C4A882" stroke-width="1"/>
  <text x="56" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#5C3D2E">inbox/transcripts/</text>
  <text x="520" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#7A5644">расшифровки (ещё не на сайт)</text>
  <rect x="36" y="180" width="1128" height="32" rx="10" fill="#FFFDF8" stroke="#C4A882" stroke-width="1"/>
  <text x="56" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#5C3D2E">inbox/notes/</text>
  <text x="520" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#7A5644">вопросы и уточнения</text>
  <rect x="36" y="216" width="1128" height="32" rx="10" fill="#E8D9C0" stroke="#C4A882" stroke-width="1"/>
  <text x="56" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#5C3D2E">content/ru · content/en</text>
  <text x="520" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#7A5644">готовые статьи → сжс.рф</text>
</svg>
