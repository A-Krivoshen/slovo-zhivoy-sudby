<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Слово Живой Судьбы — семейный архив</title>
  <desc id="heroDesc">Открытый двуязычный сайт мемуаров Кривошеиной Татьяны Тимофеевны: воспоминания, родители, фото и документы. сжс.рф</desc>

  <rect width="1200" height="400" rx="4" fill="#f3efe6"/>
  <rect x="48" y="36" width="3" height="328" fill="#2e2a24"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" fill="#7a6548">
    <text x="80" y="72" font-size="18" letter-spacing="4">СЕМЕЙНЫЙ АРХИВ · ТЕТРАДЬ</text>
  </g>

  <g font-family="Georgia, 'Times New Roman', 'Noto Serif', serif" fill="#1c1915">
    <text x="80" y="148" font-size="52" font-weight="700">Слово Живой Судьбы</text>
    <text x="80" y="196" font-size="26" fill="#5c564c">Мемуары Татьяны Тимофеевны Кривошеиной</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" fill="#2a2620">
    <text x="80" y="250" font-size="20">Открытый сайт семьи: рукописи, письма, фото</text>
    <text x="80" y="278" font-size="20">и документы — по-русски и по-английски.</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#5c564c" font-size="18">
    <text x="80" y="336">сжс.рф</text>
    <text x="200" y="336">RU · EN</text>
    <text x="320" y="336">Hugo</text>
  </g>

  <!-- folio stack: real site sections -->
  <g id="folios" transform="translate(720 56)">
    <rect x="28" y="28" width="360" height="268" rx="3" fill="#d0c6b6"/>
    <rect x="16" y="16" width="360" height="268" rx="3" fill="#e6dfd2"/>
    <rect x="4" y="4" width="360" height="268" rx="3" fill="#faf7f0" stroke="#d0c6b6" stroke-width="1.5"/>
    <line x1="36" y1="4" x2="36" y2="272" stroke="#d0c6b6" stroke-width="1"/>
    <circle cx="36" cy="48" r="3" fill="#7a6548"/>
    <circle cx="36" cy="96" r="3" fill="#7a6548"/>
    <circle cx="36" cy="144" r="3" fill="#7a6548"/>
    <circle cx="36" cy="192" r="3" fill="#7a6548"/>
    <g font-family="Georgia, 'Times New Roman', 'Noto Serif', serif" fill="#1c1915">
      <text x="60" y="56" font-size="16" fill="#7a6548">тетрадь I</text>
      <text x="60" y="100" font-size="24" font-weight="700">Воспоминания</text>
      <text x="60" y="136" font-size="20" fill="#5c564c">Родители</text>
      <text x="60" y="172" font-size="20" fill="#5c564c">Фото · Документы</text>
      <text x="60" y="208" font-size="20" fill="#5c564c">История · Люди</text>
    </g>
    <text x="300" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#7a6548">л. 01</text>
  </g>
</svg>
