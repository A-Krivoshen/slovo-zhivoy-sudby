# Build and deploy Hugo site to GitHub Pages
# PaperMod requires Hugo >= 0.146.0 (layout system change)
name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    # Skip pure README-asset bot commits (message ends with [skip ci])
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Check RU/EN figure parity
        run: ./scripts/check-figure-parity.sh
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Smoke-check key pages
        run: |
          set -euo pipefail
          check() {
            local f="$1"
            test -f "public/$f" || { echo "missing: public/$f"; exit 1; }
            # non-empty HTML
            test "$(wc -c < "public/$f")" -gt 500 || { echo "too small: public/$f"; exit 1; }
          }
          check index.html
          check vospominaniya/index.html
          check vospominaniya/dnevnik/01-moya-mama/index.html
          check lyudi/index.html
          check foto/index.html
          check mesta/index.html
          check search/index.html
          check 404.html
          check en/index.html
          check en/people/index.html
          # design tokens / nav present
          grep -q 'home-hero\|home-nav' public/index.html
          grep -q 'entity-card' public/lyudi/index.html
          grep -q 'not-found-page\|Страница не найдена' public/404.html
          grep -q 'fonts/fonts.css\|Source Serif' public/index.html || grep -q 'fonts.css' public/index.html
          grep -q 'continue-reading\|next-chapter\|reading-mode-toggle' public/vospominaniya/dnevnik/01-moya-mama/index.html
          grep -q 'diary-toc' public/vospominaniya/dnevnik/01-moya-mama/index.html
          grep -q 'album-filter' public/foto/index.html
          grep -q 'person-gallery' public/lyudi/tatyana-timofeevna-krivosheina/index.html
          grep -q 's-chego-nachat\|С чего начать' public/s-chego-nachat/index.html
          grep -q 'resume-reading' public/index.html
          echo "Smoke OK"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
