# push в main → Hugo → ветка release (как GitHub Actions).
# SourceCraft Sites раздаёт только готовую папку site/.

on:
  push:
    workflows: build-site
    filter:
      branches: main

workflows:
  build-site:
    checkout:
      fetch_depth: 0
    settings:
      max_cube_duration: 20m
    tasks:
      - name: hugo
        cubes:
          - name: build-and-deploy
            image: docker.io/library/ubuntu:24.04
            env:
              HUGO_ENVIRONMENT: production
              DEBIAN_FRONTEND: noninteractive
            script:
              - apt-get update
              - apt-get install -y --no-install-recommends ca-certificates git wget
              - wget -q -O /tmp/hugo.deb https://github.com/gohugoio/hugo/releases/download/v0.164.0/hugo_extended_0.164.0_linux-amd64.deb
              - dpkg -i /tmp/hugo.deb
              - git submodule update --init --recursive
              - hugo --minify --destination site --baseURL "https://сжс.рф/"
              - git config user.name "sourcecraft-ci"
              - git config user.email "ci@users.noreply.sourcecraft.dev"
              - git checkout -B release
              - git add -f site
              - "git diff --cached --quiet || git commit -m 'feat: release'"
              - git push origin release -f
